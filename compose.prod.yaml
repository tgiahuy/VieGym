# VieGym Production Docker Compose Configuration (VG-06)
# Usage: docker compose -f compose.yaml -f compose.prod.yaml up -d
name: viegym

services:
  backend:
    ports: !override []
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ADMIN_COOKIE_SECURE: "true"
      LOG_LEVEL: INFO

  ai-service:
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO

  postgres:
    ports: !override []

  minio:
    ports: !override []

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-web/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - edge-net
