name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Backend — Spring Boot / Maven
  # ────────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: viegym_test
          POSTGRES_USER: viegym
          POSTGRES_PASSWORD: viegym_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U viegym"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/viegym_test
      SPRING_DATASOURCE_USERNAME: viegym
      SPRING_DATASOURCE_PASSWORD: viegym_test_pw

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build, run Flyway migrations and test
        run: ./mvnw --batch-mode clean verify

      # ── OpenAPI no-diff gate ────────────────────────────────────────────────
      # Starts the application against the CI PostgreSQL service, exports the
      # live Springdoc contract and fails when the committed spec is missing or stale.
      - name: Verify OpenAPI spec is up-to-date (no-diff gate)
        run: |
          set -euo pipefail
          GENERATED="target/openapi.json"
          COMMITTED="src/main/resources/openapi/openapi.json"

          test -f "$COMMITTED" || {
            echo "ERROR: committed OpenAPI spec is missing at $COMMITTED."
            exit 1
          }

          ./mvnw --batch-mode -q -DskipTests \
            -Dspring-boot.run.profiles=local spring-boot:start
          trap './mvnw --batch-mode -q spring-boot:stop' EXIT

          curl --fail --silent --show-error --retry 10 --retry-delay 2 \
            http://localhost:8080/v3/api-docs > "$GENERATED"

          diff <(jq --sort-keys . "$GENERATED") <(jq --sort-keys . "$COMMITTED") || {
            echo "ERROR: OpenAPI spec is stale. Export /v3/api-docs and regenerate the Dart client."
            exit 1
          }

  # ────────────────────────────────────────────────────────────────────────────
  # AI Service — FastAPI / Python 3.12
  # ────────────────────────────────────────────────────────────────────────────
  ai-service-ci:
    name: AI Service (Python 3.12 / uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Sync dependencies (including dev group)
        run: uv sync --group dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Format check with Ruff
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -v

  # ────────────────────────────────────────────────────────────────────────────
  # Mobile — Flutter 3.44.4 (pinned via .fvmrc)
  # ────────────────────────────────────────────────────────────────────────────
  mobile-ci:
    name: Mobile (Flutter 3.44.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (no fatal infos)
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test --coverage

      - name: Build APK (debug — verify compilation)
        run: flutter build apk --debug --dart-define=APP_ENV=dev
