server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: viegym-backend
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/viegym}
    username: ${SPRING_DATASOURCE_USERNAME:viegym_app}
    password: ${SPRING_DATASOURCE_PASSWORD:viegym_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:logstash}
    json:
      add:
        service: viegym-backend

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method

viegym:
  dataset:
    exercise:
      enabled: ${VIEGYM_DATASET_EXERCISE_ENABLED:false}
      path: ${VIEGYM_DATASET_EXERCISE_PATH:../datasets/exports/viegym_exercises_v1.json}

otp:
  provider: ${MAIL_PROVIDER:fake}
